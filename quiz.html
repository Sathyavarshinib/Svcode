<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Quiz - Career Analysis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📋 Career Quiz</h1>
    <p>Enter your details</p>

    <form id="quizForm">
      <label>Student Name:</label>
      <input type="text" id="name" required>

      <label>Groups:</label>
      <select id="group" required>
        <option value="">-- select --</option>
        <option value="science">Science</option>
        <option value="commerce">Commerce</option>
        <option value="arts">Arts</option>
      </select>

      <label>Total Percentage (%):</label>
      <input type="number" id="percentage" required min="0" max="100">

      <label>Subject Interest:</label>
      <select id="interest" required>
        <option value="">-- select --</option>
        <option value="maths">Maths</option>
        <option value="biology">Biology</option>
        <option value="business">Business</option>
        <option value="arts">Arts</option>
        <option value="computers">Computer Science</option>
      </select>

      <label>Family Income (Annual):</label>
      <select id="income" required>
        <option value="low">₹0 - ₹1,00,000</option>
        <option value="medium">₹1,00,000 - ₹5,00,000</option>
        <option value="high">₹5,00,000 மேல்</option>
      </select>

      <label>Community / Caste:</label>
      <select id="caste" required>
        <option value="general">General</option>
        <option value="obc">OBC</option>
        <option value="sc">SC</option>
        <option value="st">ST</option>
      </select>

      <button type="submit">Submit & View Result</button>
    </form>
  </div>

  <script>
    document.getElementById("quizForm").addEventListener("submit", function(e){
      e.preventDefault();

      const data = {
        name: document.getElementById("name").value,
        group: document.getElementById("group").value,
        percentage: document.getElementById("percentage").value,
        interest: document.getElementById("interest").value,
        income: document.getElementById("income").value,
        caste: document.getElementById("caste").value
      };

      localStorage.setItem("studentData", JSON.stringify(data));
      window.location.href = "result.html";
    });
  </script>
</body>
</html>
