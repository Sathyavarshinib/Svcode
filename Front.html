<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Analysis System - Front Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 350px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }
    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #4a6cf7;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #2f4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Career Analysis System for 12th Students</h1>
    <button onclick="goToLogin()">Login</button>
  </div>  <script>
    function goToLogin() {
      window.location.href = "index.html"; // Links to the login page
    }
  </script>  </body>
</html>
