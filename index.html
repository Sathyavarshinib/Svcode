<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Career Analysis System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎓 Career Analysis System</h1>
    <p>Career Analysis System for 12th students</p>

    <form id="loginForm">
      <label>Username:</label>
      <input type="text" id="username" required>

      <label>Password:</label>
      <input type="password" id="password" required>

      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e){
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if(user === "student" && pass === "12345"){
        localStorage.setItem("username", user);
        window.location.href = "quiz.html";
      } else {
        alert("Username or Password you entered is wrong, please check once again!");
      }
    });
  </script>
</body>
</html>
