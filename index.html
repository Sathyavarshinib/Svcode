<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Analysis System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎓 Career Analysis System</h1>
    <p>12th மாணவர்களுக்கான Career வழிகாட்டி</p>
  </header>

  <main>
    <section class="form-section">
      <h2>உங்கள் விவரங்களை உள்ளிடவும்</h2>
      <form id="careerForm">
        <label>மாணவர் பெயர்:</label>
        <input type="text" id="name" required>

        <label>Group தேர்வு:</label>
        <select id="group" required>
          <option value="">-- தேர்வு செய்யவும் --</option>
          <option value="science">Science</option>
          <option value="commerce">Commerce</option>
          <option value="arts">Arts</option>
        </select>

        <label>மொத்த சதவீதம் (%):</label>
        <input type="number" id="percentage" required min="0" max="100">

        <button type="submit">Analyse Career</button>
      </form>
    </section>

    <section class="result-section" id="resultSection">
      <h2>📊 முடிவு</h2>
      <div id="resultOutput">இங்கே உங்கள் Career பரிந்துரை வரும்.</div>
    </section>
  </main>

  <footer>
    <p>© 2025 Career Analysis Project | Designed by Computer Science Students</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
