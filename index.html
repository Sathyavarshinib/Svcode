<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Career Analysis System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎓 Career Analysis System</h1>
    <p>12th மாணவர்களுக்கான Career வழிகாட்டி</p>

    <form id="loginForm">
      <label>பயனர் பெயர்:</label>
      <input type="text" id="username" required>

      <label>கடவுச்சொல்:</label>
      <input type="password" id="password" required>

      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e){
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if(user === "student" && pass === "12345"){
        localStorage.setItem("username", user);
        window.location.href = "quiz.html";
      } else {
        alert("தவறான பயனர் பெயர் அல்லது கடவுச்சொல்!");
      }
    });
  </script>
</body>
</html>
